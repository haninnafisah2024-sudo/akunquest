<style>
:root{--ink:#12302b;--mut:#5f7f78;--bg:#f1f7f4;--pri:#0d7a6b;--priD:#095a4f;--ok:#1fbf75;--okD:#118a53;--okBg:#d9f7e8;--bad:#ff5a5f;--badD:#cc3c41;--badBg:#ffe1e2;--gold:#f4a300;--line:#d5e5df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.35}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;padding:0 16px 100px}#app.w{max-width:920px}
h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.05;font-weight:800}h2{font-size:23px;font-weight:800;margin:14px 0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:16px;padding:11px 20px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--priD);width:100%;font-weight:700;font-size:18px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--priD)}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--okD)}.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--badD)}

.stack>*+*{margin-top:14px}.c{text-align:center}.mut{color:var(--mut)}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:12px 4px;background:var(--bg);font-weight:800}
.pill{display:flex;gap:5px;align-items:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bar div{max-width:520px;margin:0 auto;display:flex}
.bar button{flex:1;border:0;background:none;padding:8px 0;font-weight:700;color:var(--mut);cursor:pointer;font-size:14px}
.bar button b{display:block;font-size:24px;line-height:1.1}.bar button.on{color:var(--pri)}
.card,.opt,.chip{background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px}

.opt.sel,.card.sel{border-color:var(--pri);background:#e2f4ee}.opt.good{border-color:var(--ok);background:var(--okBg)}.opt.err{border-color:var(--bad);background:var(--badBg)}
.chip{display:inline-block;margin:4px;padding:6px 14px;font-weight:700;cursor:pointer}.chip.used{opacity:.25;pointer-events:none}
.ans{min-height:64px;border-bottom:2px solid var(--line);padding:6px 0;margin:12px 0}
.goal{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.goal i,.prog i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.unit{border-radius:18px;padding:12px 16px;color:#fff;font-weight:800;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.path{display:flex;flex-direction:column;align-items:center;gap:16px}
.node{width:76px;height:76px;border-radius:50%;border:0;font-size:32px;cursor:pointer;background:var(--ok);box-shadow:0 7px 0 var(--okD);position:relative}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--okD)}
.node.lock{background:#d3e0db;box-shadow:0 7px 0 #b3c7c0;filter:grayscale(1)}.node.now{background:var(--pri);box-shadow:0 7px 0 var(--priD)}
.node.now::after{content:"MULAI";position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#fff;color:var(--pri);border:2px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;font-weight:800;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.ltop{display:flex;gap:12px;align-items:center;padding:16px 0}.x{border:0;background:none;font-size:24px;color:var(--mut);cursor:pointer}
.prog{flex:1;height:16px;background:var(--line);border-radius:9px;overflow:hidden}
#foot{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:var(--bg);z-index:7}
#foot>*{max-width:488px;margin:0 auto;display:block}
#foot.ok{background:var(--okBg)}#foot.bad{background:var(--badBg)}#foot .msg{font-weight:800;margin-bottom:10px;font-size:19px}
.say{display:flex;align-items:center;gap:12px}
.bub{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:600;flex:1}
.t{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:17px;background:#fff}
label{display:block;font-weight:700;font-size:15px;margin:10px 0 4px}
.mas{flex:none}.mas.cheer{animation:hop .5s 3}.mas.sad{transform:rotate(-6deg)}@keyframes hop{50%{transform:translateY(-14px)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.row{display:flex;gap:10px}.row>*{flex:1}.stat{text-align:center;font-weight:800}.stat small{display:block;color:var(--mut);font-weight:600}
.rk{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;font-weight:700}.rk.me{background:#e2f4ee;border:2px solid var(--pri)}.rk.up{color:var(--okD)}.rk span:nth-child(2){flex:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:30;font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.tb tr.lo td{color:var(--badD);font-weight:700}

.doc{background:#fff;color:#000;font:14px/1.5 'Times New Roman',Times,serif;padding:26px;border:2px solid var(--line);border-radius:12px;overflow-x:auto}
.doc h1{font-size:17px;text-align:center;margin-bottom:10px;line-height:1.3}.doc h3{font-size:14.5px;margin:14px 0 4px}.doc p{margin:4px 0}.doc ol,.doc ul{margin:4px 0;padding-left:22px}
.doc table{border-collapse:collapse;width:100%;margin:6px 0}.doc td,.doc th{border:1px solid #000;padding:4px 7px;vertical-align:top;text-align:left}.doc th{background:#eee}
.ln{border-bottom:1px solid #444;height:24px}.pb{page-break-before:always;margin-top:30px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;border:0;padding:0;border-radius:0}@page{margin:16mm}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

function stats(){return allD().map(d=>{const l=d.log||[],by={};l.forEach(x=>(by[x.u]=by[x.u]||[]).push(x.acc));let wkU='-',m=101;for(const k in by){const v=by[k].reduce((a,b)=>a+b,0)/by[k].length;if(v<m){m=v;wkU=k}}
return{d,n:l.length,avg:l.length?Math.round(l.reduce((s,x)=>s+x.acc,0)/l.length):null,wk:l.length?wkU:'-'}})}
function progTable(cls){const R=stats();return `<table ${cls?'class="tb"':''}><tr><th>Nama</th><th>Tingkat</th><th>XP</th><th>Selesai</th><th>Akurasi</th><th>Perlu penguatan</th></tr>${R.map(s=>`<tr class="${s.avg!=null&&s.avg<60&&cls?'lo':''}"><td>${esc(s.d.name)}</td><td>${LV[s.d.level]||'-'}</td><td>${s.d.xp||0}</td><td>${s.d.done||0}/8</td><td>${s.avg==null?'-':s.avg+'%'}</td><td>${s.wk}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada siswa.</td></tr>'}</table>`}
function progHTML(){const R=stats(),A=R.filter(s=>s.avg!=null),ca=A.length?Math.round(A.reduce((a,s)=>a+s.avg,0)/A.length)+'%':'-',tc={};R.forEach(s=>s.wk!=='-'&&(tc[s.wk]=(tc[s.wk]||0)+1));const hard=Object.keys(tc).sort((a,b)=>tc[b]-tc[a])[0]||'-';
return `<div class="row"><div class="card stat">${R.length}<small>siswa</small></div><div class="card stat">${ca}<small>rata-rata akurasi</small></div><div class="card stat" style="font-size:15px">${hard}<small>topik tersulit</small></div></div><div class="card" style="overflow-x:auto">${progTable(1)}</div>
<div class="row"><button class="btn" onclick="xl(allD(),'progres-siswa-'+today())">📊 Ekspor Excel</button><button class="btn ghost" onclick="G.doc=progDoc();draw()">📄 Laporan PDF</button></div>
<p class="mut" style="font-size:14px">Siswa di perangkat lain mengirim kode progres dari menu Profil. Tempel di sini untuk menggabungkannya.</p><input class="t" id="ic" placeholder="Tempel kode progres siswa"><button class="btn ghost" onclick="imp()">Impor kode siswa</button>${G.doc?prev():''}`}
function progDoc(){return `<h1>LAPORAN PROGRES SISWA<br>AKUNTANSI KEUANGAN</h1>${idt()}<p>Tanggal cetak: ${today()}</p>${progTable(0)}`}
function imp(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#ic').value.trim()))));if(!o.u||!o.d)throw 0;U[o.u]=U[o.u]||{pin:null};U[o.u].data=o.d;if(o.u===CUR)S=o.d;save();toast('Siswa diimpor');draw()}catch(e){toast('Kode tidak valid')}}
/* generator RPP / LKPD / soal */
const F={rpp:['RPP / Modul Ajar',()=>rpp()],lkpd:['LKPD',()=>lkpd()],soal:['Soal & Kunci Jawaban',()=>soal()]};
function genHTML(){const t=G.tab,so=t==='soal';if(!so&&G.topic<0)G.topic=0;const n=G.topic<0?UNITS.reduce((a,u)=>a+u.items.length,0):UNITS[G.topic].items.length;
const f=(l,k,ty='text')=>`<div><label>${l}</label><input class="t" type="${ty}" value="${esc(G[k])}" oninput="G.${k}=${ty==='number'?'+this.value':'this.value'};sg()"></div>`;
return `<div class="card"><label style="margin-top:0">Topik materi</label><select class="t" onchange="G.topic=+this.value">${UNITS.map((u,i)=>`<option value="${i}" ${G.topic===i?'selected':''}>${u.i} ${u.t}</option>`).join('')}${so?`<option value="-1" ${G.topic<0?'selected':''}>Semua topik</option>`:''}</select>
<div class="row" style="flex-wrap:wrap">${f('Satuan pendidikan','sekolah')}${f('Nama guru','guru')}${f('Kelas','kelas')}${t==='rpp'?f('Alokasi waktu (menit)','waktu','number'):''}${so?f('Jumlah pilihan ganda','npg','number')+f('Jumlah uraian','nur','number'):''}</div>
${so?`<small class="mut">Bank soal pilihan ganda tersedia: ${n} butir untuk pilihan ini.</small>`:''}</div>
<button class="btn ok" onclick="G.doc=F['${t}'][1]();draw()">✨ Buat ${F[t][0]}</button>${G.doc?prev():''}`}
function prev(){return `<div class="card"><b>Pratinjau</b> <span class="mut">(klik teks untuk mengedit sebelum dicetak)</span></div><div class="doc" id="dc" contenteditable="true" oninput="G.doc=this.innerHTML">${G.doc}</div><button class="btn" onclick="pdf()">🖨️ Simpan / Cetak sebagai PDF</button><p class="mut" style="font-size:14px">Di jendela cetak, pilih tujuan "Simpan sebagai PDF".</p>`}
function pdf(){const e=$('#dc');if(!e)return;$('#pr').innerHTML=e.innerHTML;const t=document.title;document.title='Perangkat-Akuntansi-'+today();setTimeout(()=>{print();document.title=t},50)}
const idt=()=>`<table><tr><td width="22%">Satuan Pendidikan</td><td>${esc(G.sekolah)||'………………'}</td><td width="12%">Kelas</td><td>${esc(G.kelas)}</td></tr><tr><td>Mata Pelajaran</td><td>Akuntansi Keuangan</td><td>Guru</td><td>${esc(G.guru)||'………………'}</td></tr></table>`;
const ol=a=>'<ol>'+a.map(x=>`<li>${x}</li>`).join('')+'</ol>',ln=n=>'<div class="ln"></div>'.repeat(n);
const ttd=()=>`<table style="margin-top:18px"><tr><td style="border:0;text-align:center">Mengetahui,<br>Kepala Sekolah<br><br><br><br>(………………………)</td><td style="border:0;text-align:center">Guru Mata Pelajaran<br><br><br><br><br>(${esc(G.guru)||'………………………'})</td></tr></table>`;
function rpp(){const u=UNITS[G.topic],w=Math.max(20,+G.waktu||90),a=Math.round(w*.15),b=Math.round(w*.7),c=w-a-b;
return `<h1>MODUL AJAR / RENCANA PELAKSANAAN PEMBELAJARAN<br>AKUNTANSI KEUANGAN</h1>${idt()}<p><b>Topik:</b> ${u.t} &nbsp; <b>Alokasi waktu:</b> ${w} menit</p>
<h3>A. Tujuan Pembelajaran</h3>${ol(u.tp)}<h3>B. Pemahaman Bermakna</h3><p>${u.k}</p>
<h3>C. Model dan Metode</h3><p>Problem Based Learning, diskusi kelompok, latihan terbimbing, dan kuis interaktif gamifikasi (Ruang Siswa AkunQuest).</p>
<h3>D. Kegiatan Pembelajaran</h3><table><tr><th width="16%">Tahap</th><th>Kegiatan</th><th width="14%">Waktu</th></tr>
<tr><td>Pendahuluan</td><td>Salam, doa, dan presensi. Apersepsi dengan pertanyaan pemantik: "${u.pm}" Guru menyampaikan tujuan dan alur pembelajaran.</td><td>${a} menit</td></tr>
<tr><td>Inti</td><td>${ol(['Guru menjelaskan konsep '+u.t+' disertai contoh transaksi.','Siswa berkelompok mengerjakan LKPD, misalnya: '+u.kasus[0],'Kelompok mempresentasikan hasil; guru dan kelompok lain memberi umpan balik.','Siswa memperkuat pemahaman melalui kuis interaktif.'])}</td><td>${b} menit</td></tr>
<tr><td>Penutup</td><td>Siswa dan guru menyimpulkan materi, melakukan refleksi, memberikan tugas/penilaian, dan menginformasikan materi berikutnya.</td><td>${c} menit</td></tr></table>
<h3>E. Asesmen</h3><ul><li>Diagnostik: pertanyaan pemantik di awal.</li><li>Formatif: observasi diskusi dan hasil LKPD.</li><li>Sumatif: tes tertulis pilihan ganda dan uraian; nilai = skor perolehan ÷ skor maksimum × 100.</li></ul>
<h3>F. Refleksi</h3><ul><li>Guru: bagian mana yang belum dikuasai sebagian besar siswa? Apa tindak lanjutnya?</li><li>Siswa: apa yang sudah kupahami dan apa yang masih membingungkan?</li></ul>${ttd()}`}
function lkpd(){const u=UNITS[G.topic];
return `<h1>LEMBAR KERJA PESERTA DIDIK (LKPD)<br>${u.t.toUpperCase()}</h1><table><tr><td width="18%">Nama</td><td></td><td width="12%">Kelas</td><td>${esc(G.kelas)}</td></tr><tr><td>Kelompok</td><td></td><td>Tanggal</td><td></td></tr></table>
<h3>Tujuan Pembelajaran</h3>${ol(u.tp)}<h3>Ringkasan Konsep</h3><p>${u.k}</p>
<h3>Kegiatan 1: Latihan Dasar</h3><p>Lengkapilah tabel berikut dengan tepat.</p><table><tr><th width="6%">No</th><th>${u.h[0]}</th><th width="38%">${u.h[1]}</th></tr>${u.items.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td style="height:28px"></td></tr>`).join('')}</table>
<h3>Kegiatan 2: Studi Kasus</h3>${u.kasus.map((k,i)=>`<p>${i+1}. ${k}</p>${ln(3)}`).join('')}<h3>Kesimpulan</h3>${ln(2)}<h3>Refleksi</h3><p>Bagian yang paling mudah: ………………… Bagian yang masih sulit: …………………</p>`}
function soal(){const ts=G.topic<0?UNITS.map((_,i)=>i):[G.topic],K=[],tl=G.topic<0?'Semua Topik':UNITS[G.topic].t;
const P=sh(ts.flatMap(ui=>UNITS[ui].items.map(it=>[it,ui]))).slice(0,Math.max(0,+G.npg||0)),ur=sh(ts.flatMap(ui=>UNITS[ui].ur)).slice(0,Math.max(0,+G.nur||0));
const pg=P.map(([it,ui])=>{const o=opts(it,ui);K.push('ABCD'[o.indexOf(it[1])]);return `<li>${UNITS[ui].q(it[0])}${o.map((x,j)=>`<div>${'ABCD'[j]}. ${x}</div>`).join('')}</li>`}).join('');
return `<h1>SOAL ASESMEN<br>AKUNTANSI KEUANGAN</h1>${idt()}<p><b>Topik:</b> ${tl}<br>Nama: ………………………… &nbsp; No. Absen: ……</p>
${pg?`<h3>I. Pilihan Ganda</h3><p>Pilihlah jawaban yang paling tepat!</p><ol>${pg}</ol>`:''}${ur.length?`<h3>${pg?'II':'I'}. Uraian</h3><ol>${ur.map(x=>`<li>${x[0]}${ln(3)}</li>`).join('')}</ol>`:''}
<div class="pb"></div><h1>KUNCI JAWABAN DAN PEDOMAN PENSKORAN</h1><p><b>Pilihan ganda</b> (1 poin/butir): ${K.map((k,i)=>`${i+1}. ${k}`).join(', ')||'-'}</p>
${ur.length?`<p><b>Uraian</b> (maksimum 5 poin/butir):</p>${ol(ur.map(x=>x[1]))}`:''}<p>Skor maksimum = ${P.length+ur.length*5}. Nilai = skor perolehan ÷ skor maksimum × 100.</p>`}
/* ekspor */
const rowSum=d=>({'Nama':d.name,'Username':d.username||'-','Tingkat':LV[d.level]||'-','Total XP':d.xp||0,'XP Minggu Ini':d.wxp||0,'Streak':d.streak||0,'Pelajaran Selesai':(d.done||0)+'/8','Hati':d.hearts==null?'-':d.hearts,'Terakhir Belajar':d.last||'-','Dibuat':(d.created||'').slice(0,10)});
function xl(list,fn){if(!list.length)return toast('Belum ada data');
const rows=list.map(rowSum),his=list.flatMap(d=>(d.log||[]).map(l=>({'Nama':d.name,'Username':d.username||'-','Waktu':l.t.replace('T',' ').slice(0,16),'Unit':l.u,'Pelajaran':l.n,'Akurasi (%)':l.acc,'XP':l.xp,'Durasi (detik)':l.s,'Tingkat':LV[l.lv]||'-'})));
if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Ringkasan');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(his.length?his:[{Info:'Belum ada riwayat sesi'}]),'Riwayat Sesi');XLSX.writeFile(wb,fn+'.xlsx');return toast('File Excel diunduh')}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"',k=Object.keys(rows[0]),csv='\ufeff'+[k.map(q).join(','),...rows.map(r=>k.map(c=>q(r[c])).join(','))].join('\r\n'),a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn+'.csv';a.click();toast('Library Excel gagal dimuat, diunduh sebagai CSV')}
function syncSheet(){if(!SHEET_URL||!S)return;try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(rowSum(S))})}catch(e){}}
draw();
</script>
</body>
</html>
